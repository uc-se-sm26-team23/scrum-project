<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Box</title>
    <style>

        body {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .chat-container {
            width: 400px;
            border: 1px solid #000000;
            border-radius: 8px;
            overflow: hidden;
        }

        .messages {
            height: 300px;
            padding: 10px;
            overflow-y: auto;
            background-color: #f5f5f5;
        }

        .message {
            background: white;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ccc;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        .input-area button {
            padding: 10px 15px;
            border: none;
            background: #0078ff;
            color: white;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id = "chat-message" placeholder="Type Message Here...">
        <button id="send-button">Send</button>
        <script src="SendMessage.js">
        </script>
    </div>
</body>
</html>
