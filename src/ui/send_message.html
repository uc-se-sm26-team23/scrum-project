<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Box</title>
    <!-- <link rel="stylesheet" href="send_message.css"></link> uncomment this to include the styling -->
</head>
<body>
<!-- Sidebar -->
<aside id="side-panel" class="side-panel">
        <div class="panel-header">
            <h3>Online Users</h3>
            <button id="users-toggle-btn">Close</button>
        </div>
        <div class="panel-content">
            <ul id="user-list">
                <!-- JavaScript will populate this -->
            </ul>
        </div>
    </aside>

    <!-- Toggle Button -->
    <button id="users-toggle-btn">☰ Users</button>

<b>System status: </b><br>
<div id="status" style="width:625px; height:75px; overflow-y:scroll;"></div>
<b>Chat Responses:</b><br>
<div class="chat-container">
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="chat-message" placeholder="Type Message Here...">
        <button id="send-button">Send</button>
        <script src="send_message.js"></script>
    </div>
</div>
</body>
</html>
