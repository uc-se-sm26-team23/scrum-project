<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger Login</title>

    <!--Bootstrap’s CSS-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.11/purify.min.js" 
    integrity="sha512-vBe+8DnrK9HGgW5O2AOqY/sJxCkEXEilaOolPs6lx/dxgn9K7dJIsHCOYAJL9ZaqImJbeV9MQsLLaSToUWSCXQ==" 
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="index.css">
    

    <!-- 1. Load client library to send/receive real-time messages -->
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <!--Bootstrap's JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <div id="loginUI">
        <div class="login-container">
            <h1>Messenger</h1>
            <p>Enter your username to start chatting</p>

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Username" pattern="\w{3,20}" required title="Username must be between 3–20 characters"/>
            
            </div>

            <button id="joinBtn">Join Chat</button>
        </div>
    </div>

    <div id="chatUI" style="display:none">
        <aside id="side-panel" class="side-panel">
            <div class="panel-header">
                <h3>Online Users</h3>
                <button id="users-toggle-close">Close</button>
            </div>
            <div class="panel-content">
                <ul id="user-list">
                    <!-- JavaScript will populate this -->
                </ul>
            </div>
        </aside>

        <button id="users-toggle-main">☰ Users</button>

        <br><b>System status: </b><br>
        <div id="status" style="width:625px; height:75px; overflow-y:scroll;"></div>
        <b>Chat Responses:</b><br>
        <div class="chat-container">
            <div class="messages" id="messages"></div>

            <div id="typingIndicator"></div>

            <div class="input-area">
                <input type="text" id="chat-message" placeholder="Type Message Here...">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>


    <script src="client.js"></script>
</body>
</html>
