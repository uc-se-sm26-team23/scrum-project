<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger Login</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.11/purify.min.js" 
    integrity="sha512-vBe+8DnrK9HGgW5O2AOqY/sJxCkEXEilaOolPs6lx/dxgn9K7dJIsHCOYAJL9ZaqImJbeV9MQsLLaSToUWSCXQ==" 
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- <link rel="stylesheet" href="index.css"></link> uncomment this to include the styling-->
</head>

<body>
    <div class="login-container">
        <h1>Messenger</h1>
        <p>Enter your username to start chatting</p>

        <div class="input-group">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Enter your username" />
        </div>

        <button id="enter-button">Enter</button>
    </div>

    <script src="in_out.js"></script>
</body>
</html>
