<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger Login</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.11/purify.min.js" 
    integrity="sha512-vBe+8DnrK9HGgW5O2AOqY/sJxCkEXEilaOolPs6lx/dxgn9K7dJIsHCOYAJL9ZaqImJbeV9MQsLLaSToUWSCXQ==" 
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="index.css">
    

    <!-- CSP-->
    <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' https://*; child-src 'none'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://cdnjs.cloudflare.com;" />

    <!-- 1. Load client library to send/receive real-time messages -->
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div id="loginUI">
        <div class="login-container">
            <h1>Messenger</h1>
            <p>Enter your username to start chatting</p>

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Username" pattern="\w{3,20}" required title="Username must be between 3–20 characters"/>
            
            </div>

            <button id="joinBtn">Join Chat</button>
        </div>
    </div>

    <div id="chatUI" style="display:none">
        <b>System status: </b><br>
        <div id="status" style="width:625px; height:75px; overflow-y:scroll;"></div>
        <b>Chat Responses:</b><br>
        <div class="chat-container">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="chat-message" placeholder="Type Message Here...">
            
                <button id="send-button">Send</button>
                <script src="send_message.js"></script>
            </div>
        </div>
    </div>

    <!-- <script src="client.js"></script> -->
</body>
</html>
